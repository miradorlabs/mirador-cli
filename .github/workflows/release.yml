name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload archives
  id-token: write # OIDC identity for signing the provenance attestation
  attestations: write # store the attestation with GitHub

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # GoReleaser builds the changelog from commit history; a shallow clone
          # produces an empty one.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # A release that ships a vulnerable stdlib is worse than a late release, and this
      # binary handles credentials. Pinned so the scanner is a reproducible input.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on miradorlabs/homebrew-tap. The default
          # GITHUB_TOKEN is scoped to this repo only and cannot push the cask.
          # Without it the release still publishes; only the tap update fails.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Signed build provenance for every published artifact, verifiable with
      # `gh attestation verify <file> --owner miradorlabs`. Runs after GoReleaser so
      # it attests exactly the bytes that were uploaded to the Release.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
